[package]
name = "raft-file-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
raft-event-loop = { path = "../raft-event-loop" }
raftcore = { path = "../raftcore" }
tokio = { version = "1.52.2", features = ["fs", "io-util"] }
postcard = { version = "1.1.3", features = ["alloc"]}
serde = { version = "1", features = ["derive"] } 

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "fs"]}
