[package]
name = "raft-tcp-transport"
version = "0.1.0"
edition = "2024"

[dependencies]
raft-event-loop = { path = "../raft-event-loop" }
raftcore = { path = "../raftcore" }
tokio = { version = "1.52.2", features = ["net"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
futures = "0.3.32"
postcard = { version = "1.1.3", features = ["alloc"]} 
bytes = "1.11.1"

[dev-dependencies]
tokio = { version = "1.52.2", features = ["rt", "macros"]}
